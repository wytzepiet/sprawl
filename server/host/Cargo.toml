# The server: the game on a clock, over websockets, saved to SQLite.
[package]
name = "sprawl-server"
version = "0.1.0"
edition = "2024"

[dependencies]
sprawl = { path = ".." }
model = { path = "../model" }
land = { path = "../land" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
rand = "0.9"
rusqlite = { version = "0.34", features = ["bundled"] }
