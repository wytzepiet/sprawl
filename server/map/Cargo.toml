# What is where: the land as built on, the roads and lots, the buildings,
# the cars on them and who lives and works where. It runs nothing; the
# sim (`sprawl`) runs the town over it.
[package]
name = "map"
version = "0.1.0"
edition = "2024"

[dependencies]
fixed = { path = "../fixed" }
land = { path = "../land" }
model = { path = "../model" }
park = { path = "../park" }
rand = { version = "0.9", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
