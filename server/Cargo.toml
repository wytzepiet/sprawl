# The game itself: the world, its cars and people, as a library with no
# clock on the wall and no IO, so the server (host/) and a browser (web/)
# drive the same simulation.
[package]
name = "sprawl"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["fixed", "park", "land", "model", "map", "traffic", "interchange", "host", "web"]
default-members = [".", "fixed", "park", "land", "model", "map", "traffic", "interchange", "host"]

[dependencies]
fixed = { path = "fixed" }
land = { path = "land" }
model = { path = "model" }
map = { path = "map" }
traffic = { path = "traffic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat"] }
# Seeded generators only: nothing in the game rolls from the OS, which is
# also what lets it build for the browser.
rand = { version = "0.9", default-features = false, features = ["std"] }
serde_bytes = "0.11.19"

# The suite simulates days of a town, and a day at opt-level 0 takes a
# minute. Assertions and overflow checks stay on: it checks the same things,
# just faster.
[profile.test]
opt-level = 3

# The game loop is a spawned task, and tokio survives a task's panic: the
# process kept its port and answered sockets with nothing, which in the
# browser is an empty world with no error anywhere. A panic ends the server.
#
# Optimised, as the suite is, so the server played is the one measured: at
# opt-level 0 a wake ran thirty times slower than in the tests, and stalled
# the clock for seconds that `cargo test town` never saw. Incremental, a
# rebuild after an edit costs the same two or three seconds either way.
[profile.dev]
opt-level = 3
panic = "abort"

[profile.release]
panic = "abort"
