[package]
name = "sprawl-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
ts-rs = { version = "10", features = ["serde-compat"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures = "0.3"
rand = "0.9"
rusqlite = { version = "0.34", features = ["bundled"] }
noise = "0.9"
serde_bytes = "0.11.19"

# The suite simulates days of a town, and a day at opt-level 0 takes a
# minute. Assertions and overflow checks stay on: it checks the same things,
# just faster.
[profile.test]
opt-level = 3
