# What everything in the game is, and the fixed rules of each kind: every
# thing it keeps and sends, knowing nothing of the world they are in.
[package]
name = "model"
version = "0.1.0"
edition = "2024"

[dependencies]
land = { path = "../land" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
ts-rs = { version = "10", features = ["serde-compat"] }
