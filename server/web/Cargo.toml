# The game in a browser: the same simulation, driven by a Web Worker and
# spoken to in the same messages the server's socket carries.
[package]
name = "sprawl-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sprawl = { path = ".." }
interchange = { path = "../interchange" }
model = { path = "../model" }
map = { path = "../map" }
traffic = { path = "../traffic" }
wasm-bindgen = "0.2"
js-sys = "0.3"
rmp-serde = "1"
serde_json = "1"
