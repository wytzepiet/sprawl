# The bench (client/src/engine/PerfReport.tsx) on hardware that is no one's
# laptop: real Android phones in Firebase Test Lab, each opening the game's
# `?bench` in Chrome (bench/android), and an NVIDIA T4 VM in EC2. Their reports
# land on that game's /perf; the run's summary prints them.
#
# By hand (Actions › Bench), or by a tag from any branch: `git tag
# bench/<preview slug>/<anything> && git push origin --tags` benches
# https://<slug>.<preview domain>.
# Phones: secret GCP_SA_KEY and variable GCP_PROJECT, a Firebase project on
# the free plan (a few physical runs a day). GPU: secrets AWS_ACCESS_KEY_ID
# and AWS_SECRET_ACCESS_KEY.
name: Bench

on:
  push:
    tags: ['bench/**']
  workflow_dispatch:
    inputs:
      url:
        description: The game, e.g. https://main.preview.sprawl.nl
        required: true
      where:
        description: Tile and half-width the camera looks round, x,y,half
        default: '6,80,15'

env:
  URL: ${{ inputs.url }}
  WHERE: ${{ inputs.where || '6,80,15' }}

jobs:
  phones:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'push'
        run: echo "URL=https://$(echo "${{ github.ref_name }}" | cut -d/ -f2).preview.sprawl.nl" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle -p bench/android -q assembleDebug assembleDebugAndroidTest
      - uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.GCP_SA_KEY }}' }
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run on Test Lab
        run: |
          echo "TAB=fl-$GITHUB_RUN_ID" >> $GITHUB_ENV
          devices=()
          for d in ${{ vars.BENCH_PHONES || 'a54x:34 shiba:34' }}; do devices+=(--device "model=${d%:*},version=${d#*:}"); done
          gcloud firebase test android run --project "${{ vars.GCP_PROJECT }}" --type instrumentation \
            --app bench/android/app/build/outputs/apk/debug/app-debug.apk \
            --test bench/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            "${devices[@]}" --timeout 5m --no-record-video \
            --environment-variables "^;^url=$URL/?bench=$WHERE;tab=fl-$GITHUB_RUN_ID" || echo "::warning::Test Lab said the run failed; the reports below say what the phones did"
      - uses: oven-sh/setup-bun@v2
      - name: What the phones measured
        run: |
          cd client
          for tab in $(curl -s "$URL/perf" | grep -o "\"tab\":\"$TAB-[^\"]*\"" | sort -u | cut -d'"' -f4); do
            echo "### $tab" >> $GITHUB_STEP_SUMMARY
            bun scripts/bench.ts --url "$URL" --read "$tab" | tee -a $GITHUB_STEP_SUMMARY
          done

  # A GPU VM in EC2 (g4dn.xlarge, an NVIDIA T4, about ten cents a run): a
  # desktop GPU that never throttles, for numbers that compare run to run.
  # The account is an AWS-run project account: Stockholm only, no spot.
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_DEFAULT_REGION: eu-north-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'push'
        run: echo "URL=https://$(echo "${{ github.ref_name }}" | cut -d/ -f2).preview.sprawl.nl" >> $GITHUB_ENV
      - run: echo "TAB=gpu-t4-$(date +%s)" >> $GITHUB_ENV
      - name: Run on a GPU VM
        run: |
          set -euo pipefail
          ami=$(aws ssm get-parameter --name /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id --query Parameter.Value --output text)
          sed -e "s#BENCH_URL#$URL/?bench=$WHERE#" -e "s#TAB#$TAB#" bench/gpu-vm.sh > user-data.sh
          id=$(aws ec2 run-instances --image-id "$ami" --instance-type g4dn.xlarge --count 1 \
            --instance-initiated-shutdown-behavior terminate --user-data file://user-data.sh \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=sprawl-bench}]' \
            --query 'Instances[0].InstanceId' --output text)
          echo "instance $id"
          for _ in $(seq 100); do
            [ "$(aws ec2 describe-instances --instance-ids "$id" --query 'Reservations[0].Instances[0].State.Name' --output text)" = terminated ] && break
            sleep 15
          done
          aws ec2 terminate-instances --instance-ids "$id" >/dev/null  # in case it outlived the wait
          aws ec2 get-console-output --instance-id "$id" --latest --output text | tail -60 || true
      - uses: oven-sh/setup-bun@v2
      - name: What the GPU measured
        run: cd client && bun scripts/bench.ts --url "$URL" --read "$TAB" | tee -a $GITHUB_STEP_SUMMARY
