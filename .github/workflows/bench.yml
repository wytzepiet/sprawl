# The bench (client/src/engine/PerfReport.tsx) on hardware that is no one's
# laptop: real Android phones in Firebase Test Lab, each opening the game's
# `?bench` in Chrome (bench/android), and an NVIDIA GPU on RunPod. Their reports
# land on that game's /perf; the run's summary prints them.
#
# By hand (Actions › Bench), or by a tag from any branch: `git tag
# bench/<preview slug>/<anything> && git push origin --tags` benches
# https://<slug>.<preview domain>.
# Phones: secret GCP_SA_KEY and variable GCP_PROJECT, a Firebase project on
# the free plan (five physical runs a day). GPU: secret RUNPOD_API_KEY, on
# prepaid credit.
name: Bench

on:
  push:
    tags: ['bench/**']
  workflow_dispatch:
    inputs:
      url:
        description: The game, e.g. https://main.preview.sprawl.nl
        required: true
      town:
        description: A test town (server/fixtures) run in the tab, or empty for the game's own world
        default: '15-city'
      where:
        description: Tile and half-width the camera looks round, x,y,half, then any URL params, e.g. 65,46,14&renderer=new
        default: '33,23,20'
      screen:
        description: The GPU machine's window, CSS pixels and device pixel ratio, e.g. 412x915@2.625 for a phone's
        default: '1600x1000@1'
      cpu:
        description: The GPU machine's Chrome slowed this many times (DevTools' CPU throttling), e.g. 4 for about a phone's main thread; empty for none
        default: ''
      phones:
        description: Also on Test Lab's phones (five a day, free)
        type: boolean
        default: false
      fetch:
        description: Only fetch an earlier phone run's files, from this gs:// folder
        default: ''

env:
  URL: ${{ inputs.url }}
  WHERE: ${{ inputs.where || '6,80,15' }}${{ inputs.town && format('&town={0}', inputs.town) || '' }}

jobs:
  fetch:
    if: inputs.fetch != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.GCP_SA_KEY }}' }
      - uses: google-github-actions/setup-gcloud@v2
      - run: mkdir -p files && gcloud storage cp -r "${{ inputs.fetch }}/*" files/ && find files -name '*.png' -delete
      - uses: actions/upload-artifact@v4
        with: { name: fetched, path: files }

  phones:
    if: inputs.phones
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'push'
        run: echo "URL=https://$(echo "${{ github.ref_name }}" | cut -d/ -f2).preview.sprawl.nl" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle -p bench/android -q assembleDebug assembleDebugAndroidTest
      - uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.GCP_SA_KEY }}' }
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run on Test Lab
        run: |
          echo "TAB=fl-$GITHUB_RUN_ID" >> $GITHUB_ENV
          devices=()
          for d in ${{ vars.BENCH_PHONES || 'shiba:34' }}; do devices+=(--device "model=${d%:*},version=${d#*:}"); done
          gcloud firebase test android run --project "${{ vars.GCP_PROJECT }}" --type instrumentation \
            --app bench/android/app/build/outputs/apk/debug/app-debug.apk \
            --test bench/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            "${devices[@]}" --timeout 25m --no-record-video --directories-to-pull /sdcard/Download/bench \
            --environment-variables "^;^url=$URL/?bench=$WHERE;tab=fl-$GITHUB_RUN_ID" 2>&1 | tee testlab.log || true
          # Each phone's screens and log, as the run's artifact.
          bucket=$(grep -o 'storage/browser/[^]]*' testlab.log | head -1 | sed 's#storage/browser/#gs://#; s#/$##')
          mkdir -p screens && gcloud storage cp -r "$bucket/*" screens/ || true
          find screens -type f ! -name '*.png' ! -name '*.txt' ! -name '*.pftrace' ! -name 'logcat' -delete
      - uses: actions/upload-artifact@v4
        with: { name: phones, path: screens }
      - uses: oven-sh/setup-bun@v2
      - name: What the phones measured
        run: |
          cd client
          for tab in $(curl -s "$URL/perf" | grep -o "\"tab\":\"$TAB-[^\"]*\"" | sort -u | cut -d'"' -f4); do
            echo "### $tab" >> $GITHUB_STEP_SUMMARY
            bun scripts/bench.ts --url "$URL" --read "$tab" | tee -a $GITHUB_STEP_SUMMARY
          done

  # A GPU machine on RunPod, an NVIDIA card, a few cents a run on prepaid
  # credit: a desktop GPU, ten to thirty times a phone's, that never
  # throttles, for numbers that compare run to run.
  gpu:
    # A power run is the phones' meters alone.
    if: ${{ !contains(inputs.where, 'power') && inputs.fetch == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'push'
        run: echo "URL=https://$(echo "${{ github.ref_name }}" | cut -d/ -f2).preview.sprawl.nl" >> $GITHUB_ENV
      - name: Run on a RunPod GPU
        env:
          KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          echo "TAB=gpu-$GITHUB_RUN_ID" >> $GITHUB_ENV
          q() { curl -sf https://api.runpod.io/graphql -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -d "$(jq -n --arg q "$1" '{query: $q}')"; }
          script=$(base64 -w0 bench/gpu.sh)
          page=$(jq -n --arg p "$URL/?bench=$WHERE&tab=gpu-$GITHUB_RUN_ID" '$p')
          args="bash -c 'echo $script | base64 -d > /b.sh && bash /b.sh'"
          # The cheapest card that is free, of those that draw like a player's.
          echo "credit: $(q 'query { myself { clientBalance } }' | jq -r '.data.myself.clientBalance // .errors[0].message // "?"')"
          for gpu in "NVIDIA RTX A4000" "NVIDIA GeForce RTX 3070" "NVIDIA RTX A5000" "NVIDIA GeForce RTX 4070 Ti" "NVIDIA RTX 4000 Ada Generation" "NVIDIA GeForce RTX 3080" "NVIDIA GeForce RTX 3090" "NVIDIA GeForce RTX 4080" "NVIDIA RTX A4500" "NVIDIA L4"; do
            # Why a card was not had, said, so a run that finds none says why.
            curl -s https://api.runpod.io/graphql -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -d "$(jq -n --arg q "query { gpuTypes(input: { id: \"$gpu\" }) { id lowestPrice(input: { gpuCount: 1 }) { stockStatus uninterruptablePrice } } }" '{query: $q}')" | jq -c '.data.gpuTypes[0] // .errors' || true
            id=$(q "mutation { podFindAndDeployOnDemand(input: { cloudType: ALL, gpuCount: 1, gpuTypeId: \"$gpu\", name: \"sprawl-bench\", imageName: \"ubuntu:22.04\", containerDiskInGb: 20, volumeInGb: 0, minVcpuCount: 2, minMemoryInGb: 8, dockerArgs: $(jq -n --arg a "$args" '$a'), env: [{ key: \"NVIDIA_DRIVER_CAPABILITIES\", value: \"all\" }, { key: \"PAGE\", value: $page }, { key: \"SCREEN\", value: \"${{ inputs.screen || '1600x1000@1' }}\" }, { key: \"CPU\", value: \"${{ inputs.cpu }}\" }] }) { id } }" | jq -r '.data.podFindAndDeployOnDemand.id // empty') || true
            [ -n "$id" ] && { echo "$gpu: $id"; break; }
          done
          [ -n "${id:-}" ] || { echo "no GPU free"; exit 1; }
          echo "POD=$id" >> $GITHUB_ENV
          # Its last report is what each kind costs. A test town's settle
          # waits for eight minutes of its traffic, at up to fifty times
          # speed, which a pod's two cores may not reach: up to 25 minutes.
          for _ in $(seq 150); do
            curl -s "$URL/perf?tab=gpu-$GITHUB_RUN_ID" | grep -q '"phase":"cost"' && break
            sleep 10
          done
      - name: Delete the GPU machine
        if: always() && env.POD != ''
        env:
          KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          curl -sf https://api.runpod.io/graphql -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d "{\"query\":\"mutation { podTerminate(input: { podId: \\\"$POD\\\" }) }\"}"
      - uses: oven-sh/setup-bun@v2
      - name: What the GPU measured
        run: |
          [ -z "${{ inputs.cpu }}" ] || echo "CPU throttled ${{ inputs.cpu }}x" >> $GITHUB_STEP_SUMMARY
          cd client && bun scripts/bench.ts --url "$URL" --read "$TAB" | tee -a $GITHUB_STEP_SUMMARY
