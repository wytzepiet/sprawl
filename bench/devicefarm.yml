# What a Device Farm phone does (bench.yml fills in BENCH_URL): Chrome opened
# on the game's `?bench`, past its first-run screens, for the bench's seventy
# seconds and more; the screen at the end kept with the run's files.
version: 0.1
android_test_host: amazon_linux_2
phases:
  install:
    commands: []
  test:
    commands:
      - export TAB=df-$(echo "$DEVICEFARM_DEVICE_NAME" | tr -c 'A-Za-z0-9\n' '-')-$(date +%s)
      - adb -s $DEVICEFARM_DEVICE_UDID shell "echo '_ --disable-fre --no-default-browser-check --no-first-run' > /data/local/tmp/chrome-command-line"
      - adb -s $DEVICEFARM_DEVICE_UDID shell am set-debug-app --persistent com.android.chrome
      - adb -s $DEVICEFARM_DEVICE_UDID shell am force-stop com.android.chrome
      - adb -s $DEVICEFARM_DEVICE_UDID shell am start -a android.intent.action.VIEW -n com.android.chrome/com.google.android.apps.chrome.Main -d "'BENCH_URL&tab=$TAB'"
      - sleep 110
      - adb -s $DEVICEFARM_DEVICE_UDID exec-out screencap -p > $DEVICEFARM_LOG_DIR/$TAB.png
      - echo "$TAB"
