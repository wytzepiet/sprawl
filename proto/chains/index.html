<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sprawl Chains</title>
<style>
  /* one screen: the map fills it, black panes float at the edges */
  :root { --grass: #a8d27a; --ink: #0b0c0e; --ink2: #1b1d20; --ink3: #24262a; --text: #f2f1ec; --soft: #d9d8d2; --dim: #9a9c9f; --line: #2a2c30; --go: #8fd36b; --no: #ff9a85;
    --t: calc(12px + env(safe-area-inset-top, 0px)); --b: calc(12px + env(safe-area-inset-bottom, 0px)); --l: max(12px, env(safe-area-inset-left, 0px)); --r: max(12px, env(safe-area-inset-right, 0px)); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--grass); overflow: hidden; font: 14px/1.3 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--text); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .pane { position: fixed; background: var(--ink); border-radius: 18px; padding: 10px 14px; }
  #top { top: var(--t); left: var(--l); min-width: 132px; }
  #pop { font-size: 26px; font-weight: 700; line-height: 1; }
  #pop small { font-size: 12px; font-weight: 500; color: var(--dim); margin-left: 5px; }
  #bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
  #bar i { display: block; height: 100%; width: 0; background: var(--go); border-radius: 3px; transition: width .4s; }
  #next { font-size: 11.5px; color: var(--dim); margin-top: 4px; white-space: nowrap; }
  #clock { top: var(--t); right: var(--r); display: flex; gap: 2px; padding: 6px; }
  button { font: inherit; color: var(--text); background: none; border: 0; border-radius: 12px; padding: 7px 10px; cursor: pointer; }
  button.on { background: var(--ink3); }
  button:focus-visible { outline: 2px solid var(--go); }
  #hint { top: calc(var(--t) + 88px); left: var(--l); max-width: min(340px, calc(100vw - 24px)); font-size: 13px; color: var(--soft); }
  #hint:empty { display: none; }
  #hint.moment { color: var(--text); }
  #hint b { color: var(--go); font-weight: 600; }
  #offer { top: var(--t); left: 50%; transform: translateX(-50%); display: none; gap: 8px; padding: 10px; max-width: calc(100vw - 24px); }
  #offer.show { display: flex; }
  #offer button { background: var(--ink2); text-align: left; padding: 10px 12px; width: 150px; }
  #offer button b { display: block; font-size: 14px; margin-bottom: 3px; }
  #offer button span { font-size: 11.5px; color: var(--dim); }
  #say { bottom: calc(var(--b) + 88px); left: 50%; transform: translateX(-50%); font-size: 12.5px; padding: 6px 12px; border-radius: 12px; white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  #say:empty { display: none; }
  #say.no { color: var(--no); }
  #tools { bottom: var(--b); left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 6px; max-width: calc(100vw - 16px); overflow-x: auto; scrollbar-width: none; touch-action: pan-x; overscroll-behavior: contain; }
  #tools::-webkit-scrollbar { display: none; }
  #tools button { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; padding: 8px 7px 6px; font-size: 11.5px; white-space: nowrap; flex: none; }
  #tools .dots { display: flex; align-items: center; gap: 2px; height: 12px; color: var(--dim); font-size: 10px; line-height: 1; }
  #tools .dots i { width: 9px; height: 9px; border-radius: 3px; display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  #tools .dots i.gr { border-radius: 50%; }
  #tools .dots svg, #tools .dots img { width: 14px; height: 14px; display: block; }
  #tools .cost { display: flex; align-items: center; gap: 2px; height: 9px; font-size: 9.5px; color: var(--dim); line-height: 1; }
  #tools .cost i { width: 6px; height: 6px; border-radius: 2px; display: block; margin-right: 3px; }
  #tools button.new { animation: fresh 1s ease-in-out infinite alternate; }
  @keyframes fresh { from { box-shadow: inset 0 0 0 1.5px rgba(143,211,107,.25); } to { box-shadow: inset 0 0 0 1.5px rgba(143,211,107,1); background: #17240f; } }
  @media (max-width: 700px) {
    #offer { top: calc(var(--t) + 88px); flex-direction: column; } #offer button { width: 250px; }
    #say { white-space: normal; text-align: center; width: max-content; }
    #clock button { padding: 7px 8px; }
    #tools { left: 8px; right: 8px; transform: none; max-width: none; }
  }
</style>
<canvas id="c"></canvas>
<div id="top" class="pane"><div id="pop">8<small>people</small></div><div id="bar"><i></i></div><div id="next"></div></div>
<div id="clock" class="pane"><button data-s="0">Ⅱ</button><button data-s="1">1×</button><button data-s="3">3×</button><button data-s="8">8×</button><button id="snd">♪</button></div>
<div id="hint" class="pane"></div>
<div id="offer" class="pane"></div>
<div id="say" class="pane"></div>
<div id="tools" class="pane"></div>
<script src="sim.js"></script>
<script src="tree.js"></script>
<script src="look.js"></script>
<script src="bot.js"></script>
<script>
const { W, H, N, GROUND, GR, DT } = Sim;
const query = new URLSearchParams(location.search);
const sim = new Sim(+query.get('seed') || 7, Tree);
const bot = query.get('bot') ? new Bot(sim, query.get('bot')) : null;
const goods = Tree.goods, homes = Tree.homes, kinds = sim.kinds;
const { rr: lrr, disc: ldisc, EDGE } = Look;
const cv = document.getElementById('c');
let cx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let cw = 0, ch = 0, dpr = 1;
const cam = { x: W / 2 + 0.5, y: H / 2 + 0.5, s: 36 };
let tool = 'view', speed = [0, 1, 3, 8].includes(+query.get('speed')) && query.get('speed') !== null ? +query.get('speed') : 1, hover = null, sound = true, picked = null;
const fx = [], fresh = new Map();

function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  cw = innerWidth; ch = innerHeight;
  cv.width = cw * dpr; cv.height = ch * dpr;
}
addEventListener('resize', resize); resize();
cam.s = Math.max(22, Math.min(64, cw / 26));

// ---- words ----
const col = g => (goods[g] || {}).col || '#999';
const gn = g => ((goods[g] || {}).name || g).toLowerCase();
const kn = k => ((kinds[k] || {}).name || k).toLowerCase();
const cap = s => s[0].toUpperCase() + s.slice(1);
const an = s => (/^[aeiou]/i.test(s) ? 'an ' : 'a ') + s;
const plural = s => /s$/i.test(s) ? s : /[^aeiou]y$/i.test(s) ? s.slice(0, -1) + 'ies' : s + 's';
const list = l => l.length < 2 ? l.join('') : l.slice(0, -1).join(', ') + ' and ' + l[l.length - 1];
const some = (n, g) => `${n} ${n === 1 ? gn(g).replace(/([^s])s$/, '$1') : gn(g)}`;
const crates = o => list(Object.keys(o || {}).filter(g => o[g] >= 1).map(g => some(Math.floor(o[g]), g)));
const makerOf = g => Object.keys(kinds).find(k => sim.open(k) && ((kinds[k].out || {})[g] || (kinds[k].brings || {})[g]));
const total = o => Object.values(o || {}).reduce((a, b) => a + Math.max(0, b), 0);

// ---- sound: small pings ----
let ac = null; const lastPing = {};
function ping(freq, len = 0.09, vol = 0.05, type = 'sine') {
  if (!sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const now = ac.currentTime;
    if (now - (lastPing[freq] || 0) < 0.06) return;
    lastPing[freq] = now;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + len);
    o.connect(g).connect(ac.destination); o.start(now); o.stop(now + len);
  } catch (e) {}
}

// ---- the tools ----
const NAMES = { view: 'Look', road: 'Road', erase: 'Clear' };
const ICON = {
  view: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6" r="4"/><path d="M9 9l4 4"/></svg>',
  road: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M1 7h12" stroke-width="6" opacity=".45"/><path d="M2 7h2M6 7h2M10 7h2" stroke-width="1.4"/></svg>',
  erase: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg>',
};
function sayKind(k) {
  const K = kinds[k];
  if (K.say) return K.say;
  const beside = K.near ? ` Stands beside ${K.near}.` : '';
  let s;
  if (K.shop) s = 'its lorry stocks the shelf and homes drive to it.';
  else if (K.builder) s = 'its lorry brings sites and growing homes what they cost.';
  else if (K.garage) s = 'one more lorry for every building it touches.';
  else if (K.harbour) s = `a ship takes ${list((Tree.exports || []).map(gn)) || 'what is brought'} away${K.brings ? ' and lands ' + list(Object.keys(K.brings).map(gn)) : ''}.`;
  else if (K.need) s = `the town's great work. It takes ${crates(K.need)} and keeps them.`;
  else if (K.out) s = `makes ${crates(K.out)}${K.ins ? ' from ' + crates(K.ins) : ''}.`;
  else s = '';
  return `${K.name}: ${s}${beside} Tap grass to place it.`;
}
const SAY = { view: 'Drag to look round. Tap a thing to see what it is doing.', road: 'Drag to lay a road. Homes come along roads near a shop.', erase: 'Drag over roads and buildings to clear them.' };

function iconOf(k) {   // the building as the map draws it, small
  const c = document.createElement('canvas'), was = cx;
  c.width = c.height = 56;
  cx = c.getContext('2d'); cx.scale(56, 56); cx.lineCap = cx.lineJoin = 'round';
  const K = kinds[k];
  drawPart({ kind: k, K, x: 0, y: 0, t: 0, have: {}, made: {}, fleet: [], near: [], door: 0, prog: 0, state: '', site: null, need: K.need ? {} : undefined, icon: true }, 0);
  cx = was;
  return `<img src="${c.toDataURL()}">`;
}
function buildTools() {
  const el = $('tools'), left = el.scrollLeft; el.innerHTML = '';
  const sq = (g, n = 1) => `<i style="background:${col(g)}"></i>`.repeat(Math.min(4, Math.max(1, Math.round(n))));
  for (const k of ['view', 'road', 'erase', ...Object.keys(kinds).filter(k => sim.open(k))]) {
    const K = kinds[k], b = document.createElement('button');
    let dots = ICON[k], cost = '';
    if (K) {
      const outs = { ...K.out, ...K.brings };
      if (Object.keys(outs).length && !K.harbour) dots = (K.ins ? Object.keys(K.ins).map(g => sq(g, K.ins[g])).join('') : K.near ? `<i class="gr" style="background:${Look.ground(K.near).col}"></i>` : '') + '›' + Object.keys(outs).map(g => sq(g, outs[g])).join('');
      else dots = iconOf(k);
      cost = Object.keys(K.cost || {}).map(g => `${K.cost[g]}<i style="background:${col(g)}"></i>`).join('') || 'free';
    }
    b.innerHTML = `<div class="dots">${dots}</div>${K ? K.name : NAMES[k]}<div class="cost">${cost}</div>`;
    b.dataset.k = k;
    b.className = (k === tool ? 'on' : '') + (fresh.has(k) ? ' new' : '');
    b.onclick = () => setTool(k);
    el.appendChild(b);
  }
  el.scrollLeft = left;
}
function setTool(k) {
  tool = k; picked = null; flowSeen.clear(); fresh.delete(k); spotsKey = '';
  for (const b of $('tools').children) b.className = (b.dataset.k === k ? 'on' : '') + (fresh.has(b.dataset.k) ? ' new' : '');
  say();
}
function say(text, no) {
  const el = $('say');
  el.textContent = text || (kinds[tool] ? sayKind(tool) : SAY[tool]) || '';
  el.className = 'pane' + (no ? ' no' : '');
}
function setSpeed(s) {
  speed = s;
  document.querySelectorAll('#clock button[data-s]').forEach(x => x.classList.toggle('on', +x.dataset.s === speed));
}
for (const b of document.querySelectorAll('#clock button[data-s]')) b.onclick = () => setSpeed(+b.dataset.s);
$('snd').onclick = () => { sound = !sound; $('snd').style.opacity = sound ? 1 : 0.35; };

function showOffer() {
  const el = $('offer');
  if (!sim.offer) { el.className = 'pane'; return; }
  el.innerHTML = '';
  sim.offer.forEach((k, i) => {
    const b = document.createElement('button'), p = Tree.picks[k];
    b.innerHTML = `<b>${p.name}</b><span>${p.say || ''}</span>`;
    b.onclick = () => { sim.pick(i); showOffer(); buildTools(); };
    el.appendChild(b);
  });
  el.className = 'pane show';
}

// ---- pointer ----
const toWorld = (px, py) => [(px - cw / 2) / cam.s + cam.x, (py - ch / 2) / cam.s + cam.y];
const toScreen = (wx, wy) => [(wx - cam.x) * cam.s + cw / 2, (wy - cam.y) * cam.s + ch / 2];
const pts = new Map();
let drag = null, pinch = null;
function stepTo(from, to, each) {   // walk a grid line, one side step at a time
  let [x, y] = from;
  for (let guard = 0; guard < 400 && (x !== to[0] || y !== to[1]); guard++) {
    const dx = to[0] - x, dy = to[1] - y;
    if (Math.abs(dx) >= Math.abs(dy)) x += Math.sign(dx); else y += Math.sign(dy);
    each(x, y);
  }
}
function act(wx, wy, first) {
  const t = [Math.floor(wx), Math.floor(wy)];
  const each = tool === 'road'
    ? (x, y) => { if (sim.setRoad(x, y)) ping(330, 0.05, 0.03, 'triangle'); }
    : (x, y) => { if (sim.erase(x, y)) ping(180, 0.07, 0.04, 'triangle'); };
  if (first) each(t[0], t[1]); else stepTo(drag.last, t, each);
  drag.last = t;
}
function build(wx, wy) {
  const x = Math.floor(wx), y = Math.floor(wy), why = sim.why(tool, x, y);
  if (why) { say(why + '.', true); ping(140, 0.12, 0.04, 'square'); return; }
  sim.place(tool, x, y); ping(440, 0.08, 0.05); ping(660, 0.1, 0.04); say();
}
function look(wx, wy) {
  const x = Math.floor(wx), y = Math.floor(wy);
  picked = sim.inside(x, y) ? sim.at[y * W + x] : null;
  flowSeen.clear();
  say(describe(picked));
}
function describe(p) {
  if (!p) return '';
  if (!p.K) {
    const L = homes[p.level], nx = homes[p.level + 1], name = L.name;
    if (p.door < 0) return `${name}: no road beside it.`;
    if (p.site) return `${name} growing into ${an(nx.name.toLowerCase())}: waits for ${crates(p.site.need) || 'its last load'} from a builder.`;
    if (p.hungry) return `${name}: goes without ${gn(lowest(p))}.`;
    let more = '';
    if (nx && (nx.tier || 0) <= sim.tier) {
      const miss = Object.keys(nx.eat).filter(g => !(g in L.eat) && !(p.shop && p.shop.have[g] > 0.05));
      more = miss.length ? ` It grows once its shop sells ${list(miss.map(gn))}.` : ' It will grow soon.';
    }
    return `${name}, ${L.people} people: fed.${more}`;
  }
  const K = p.K, name = K.name;
  if (p.dead) return '';
  if (p.site) {
    const need = crates(p.site.need) || 'its last load';
    if (p.door < 0) return `${name}, a site: waits for ${need}, and no road is beside it.`;
    const none = Object.keys(p.site.need).filter(g => p.site.need[g] - (p.site.inc[g] || 0) > 0 && !sim.parts.some(b => b.K.builder && !b.site && b.have[g] >= 1));
    return `${name}, a site: waits for ${need}` + (none.length ? `; no builder holds ${list(none.map(gn))} yet.` : ' from the builder.');
  }
  if (p.door < 0) return `${name}: no road beside it, so no lorry can come or go.`;
  if (K.shop) {
    const out = sim.shopGoods().filter(g => !(p.have[g] > 0.05));
    return `${name}: holds ${crates(p.have) || 'nothing'}` + (out.length ? `; out of ${list(out.map(gn))}.` : '.');
  }
  if (K.builder) { const n = sim.sites().length; return `${name}: holds ${crates(p.have) || 'nothing'}; ${n ? n + (n === 1 ? ' site waits.' : ' sites wait.') : 'no site waits.'}`; }
  if (K.garage) return `${name}: one more lorry for each building it touches.`;
  if (K.harbour) return `${name}: the ship comes in ${Math.max(0, Math.ceil(sim.shipAt - sim.time))} s; ${crates(p.have) || 'nothing'} waits to sail` + (crates(p.made) ? `, ${crates(p.made)} landed.` : '.');
  if (p.need) return p.done ? `${name}: finished.` : `${name}: still needs ${crates(p.need)}.`;
  const out = list(Object.keys(K.out || {}).map(gn));
  const state = p.state === 'full' ? `full, its ${out} wait to be fetched` : p.state === 'lack' ? `waits for ${gn(p.lack)}` : 'working';
  const away = p.fleet.find(v => v.job && v.job.type === 'fetch');
  return `${name}: ${state}. ` + (K.ins ? `Holds ${crates(p.have) || 'nothing'}; ` : '') + `${crates(p.made) || 'nothing'} ready.` + (away ? ` Its lorry fetches ${gn(away.job.g)}.` : '');
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: cam.s, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2 }; drag = null; return; }
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  if (tool === 'view' || kinds[tool] || e.button === 1 || e.button === 2) { drag = { pan: true, tap: e.button === 0, moved: 0 }; return; }
  drag = {};
  act(wx, wy, true);
});
cv.addEventListener('pointermove', e => {
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  hover = e.pointerType === 'touch' && !pts.has(e.pointerId) ? null : [wx, wy];
  if (!pts.has(e.pointerId)) return;
  const was = pts.get(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    const [ox, oy] = toWorld(mx, my);
    cam.s = Math.max(9, Math.min(110, pinch.s * d / pinch.d));
    cam.x = ox - (mx - cw / 2) / cam.s - (mx - pinch.mx) / cam.s; cam.y = oy - (my - ch / 2) / cam.s - (my - pinch.my) / cam.s;
    pinch.mx = mx; pinch.my = my; clampCam();
    return;
  }
  if (!drag) return;
  if (drag.pan) { cam.x -= (e.clientX - was[0]) / cam.s; cam.y -= (e.clientY - was[1]) / cam.s; drag.moved += Math.abs(e.clientX - was[0]) + Math.abs(e.clientY - was[1]); clampCam(); }
  else act(wx, wy, false);
});
const up = e => {
  if (drag && drag.pan && drag.tap && drag.moved < 8 && e.type === 'pointerup') { const w = toWorld(e.clientX, e.clientY); if (tool === 'view') look(...w); else build(...w); }
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) drag = null;
  if (e.pointerType === 'touch') hover = null;
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  cam.s = Math.max(9, Math.min(110, cam.s * Math.exp(-e.deltaY * 0.0015)));
  cam.x = wx - (e.clientX - cw / 2) / cam.s; cam.y = wy - (e.clientY - ch / 2) / cam.s; clampCam();
}, { passive: false });
function clampCam() { cam.x = Math.max(0, Math.min(W, cam.x)); cam.y = Math.max(0, Math.min(H, cam.y)); }
addEventListener('keydown', e => {
  if (e.key === 'Escape') setTool('view');
  if (e.key === ' ') setSpeed(speed ? 0 : 1);
});

// ---- the land, drawn once ----
const TP = 32, land = document.createElement('canvas');
land.width = W * TP; land.height = H * TP;
Look.land(land.getContext('2d'), sim, TP);

// ---- drawing ----
const T = () => performance.now() / 1000;
let simClock = 0;
function rr(x, y, w, h, r, fill, stroke) { lrr(cx, x, y, w, h, r, fill, stroke); }
function crate(x, y, s, g, hollow) {
  const c = col(g);
  if (hollow) { cx.lineWidth = s * 0.24; rr(x - s * 0.4, y - s * 0.4, s * 0.8, s * 0.8, s * 0.2, 'rgba(255,255,255,.6)', c); return; }
  cx.lineWidth = Math.max(0.018, s * 0.14);
  rr(x - s / 2, y - s / 2, s, s, s * 0.25, c, Look.lum(c.length === 7 ? c : '#999999') < 0.3 ? 'rgba(255,255,255,.55)' : EDGE);
}
// a line of crates: a list of goods, from x leftwards or rightwards
function line(gs, x, y, s, step, hollow) { gs.forEach((g, i) => crate(x + i * step, y, s, g, hollow)); }
const spread = (o, max, scale = 1) => { const out = []; for (const g in o) for (let n = Math.round(o[g] * scale); n > 0 && out.length < max; n--) out.push(g); return out; };

function drawRoads() {
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  const pass = (w, c, dash) => {
    cx.lineWidth = w; cx.strokeStyle = c; cx.setLineDash(dash || []); cx.beginPath();
    for (let t = 0; t < N; t++) if (sim.road[t]) {
      const x = t % W + 0.5, y = ((t / W) | 0) + 0.5;
      let any = false;

  rr(x + 0.05, y + 0.05, 0.9, 0.9, 0.18, ok ? 'rgba(255,255,255,.4)' : 'rgba(226,96,74,.4)', ok ? '#fff' : '#e2604a');
}

function drawFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt;
    const u = f.t / f.life;
    if (u >= 1) { fx.splice(i, 1); continue; }
    if (f.k === 'puff') { cx.fillStyle = `rgba(255,255,255,${0.5 * (1 - u)})`; cx.beginPath(); cx.arc(f.x + u * 0.15, f.y - u * 0.7, 0.07 + u * 0.14, 0, 7); cx.fill(); }
    if (f.k === 'ring') { cx.strokeStyle = f.c || `rgba(255,255,255,${1 - u})`; cx.globalAlpha = f.c ? 1 - u : 1; cx.lineWidth = 0.06 * (1 - u); cx.beginPath(); cx.arc(f.x, f.y, 0.3 + u * (f.r || 0.7), 0, 7); cx.stroke(); cx.globalAlpha = 1; }
  }
}

// ---- the panes ----
function opening() {
  const want = Object.keys(homes[0].eat)[0], k = makerOf(want);
  if (!k) return `The town wants ${gn(want)}.`;
  const K = kinds[k], where = q => q.near ? ` beside ${q.near}` : '';
  const from = Object.keys(K.ins || {}).map(g => { const m = makerOf(g); return m ? `${gn(g)} from ${an(kn(m))}${where(kinds[m])}` : gn(g); });
  return `The town wants ${gn(want)}. ${cap(an(kn(k)))}${where(K)} makes it` + (from.length ? ` from ${list(Object.keys(K.ins).map(gn))}: ${list(from)}.` : '.')
    + ' Each building sends its lorry for what it lacks, and takes it straight from a neighbour it touches. What you place is a site until the builder brings its cost.';
}
function sentence(d) {
  const want = gn(d.want), g = gn(d.g), holder = d.need === 'builder' ? 'builder' : 'shop';
  const head = d.need === 'builder' ? `The builders are out of ${want}.` : `${cap(want)} is short.`;
  const via = d.g !== d.want ? ` It waits for ${g}.` : '';
  const K = kinds[d.what], what = d.what ? kn(d.what) : '';
  if (d.kind === 'build') return what ? `${head}${via} Nothing makes ${g}: build ${an(what)}${K.near ? ' beside ' + K.near : ''}.` : `${head}${via} Nothing can make ${g} yet.`;
  if (d.kind === 'more') return `${head}${via} The ${plural(what)} are working flat out: build another.`;
  if (d.kind === 'site') return `${head}${via} ${cap(an(what))} is being built and waits for the builder.`;
  if (d.kind === 'wait') return `${head}${via} The ${plural(what)} are only getting going.`;
  if (d.kind === 'haul') return d.g === d.want
    ? `${head} There is ${g} at its makers, but the ${holder}'s lorry cannot keep up: build a ${holder} nearer to them, or a garage beside this one.`
    : `${head} ${cap(g)} waits at its makers: whoever uses it cannot fetch it fast enough. Stand them closer, let them touch, or add a garage.`;
  return `${head}${via}`;
}
const firstWant = Object.keys(homes[0].eat);
let trouble = { want: '', since: 0 }, moment = null;
function hintText() {
  if (sim.offer) return '';
  if (moment && T() < moment.until) return moment.html;
  if (!sim.parts.some(b => b.K.out && firstWant.some(g => b.K.out[g]))) return opening();
  const d = sim.diagnose(), want = d ? d.want : '';
  if (want !== trouble.want) trouble = { want, since: sim.time };
  return d && sim.time - trouble.since > 10 ? sentence(d) : '';
}
function hud() {
  let pop = 0; for (const h of sim.houses) pop += homes[h.level].people;
  $('pop').firstChild.nodeValue = pop;
  const t = Tree.tiers[sim.tier + 1];
  let have = 1, of = 1, words = 'Every step is open';
  if (t) {
    if (t.pop != null) { have = pop; of = t.pop; words = 'people'; }
    else { have = sim.houses.filter(h => h.level >= t.level).length; of = t.homes; words = plural(homes[t.level].name); }
    words = `${Math.min(have, of)} of ${of} ${words}`;
  }
  $('bar').firstElementChild.style.width = Math.max(0, Math.min(100, have / of * 100)) + '%';
  $('next').textContent = sim.offer ? 'Choose one' : words;
  const el = $('hint'), html = hintText();
  if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; el.className = 'pane' + (moment && html === moment.html ? ' moment' : ''); }
  const now = T();
  for (const [k, until] of fresh) if (now > until) { fresh.delete(k); const b = $('tools').querySelector(`[data-k="${k}"]`); if (b) b.classList.remove('new'); }
}
function stepOpened(tier) {
  const opened = Object.keys(kinds).filter(k => (kinds[k].tier || 0) === tier);
  const grown = homes.map((L, i) => i && (L.tier || 0) === tier ? `${plural(homes[i - 1].name)} can grow into ${plural(L.name)}.` : '').filter(Boolean);
  for (const k of opened) fresh.set(k, T() + 14);
  moment = { until: T() + 9, html: `<b>A new step.</b> ${opened.length ? 'You can now build ' + list(opened.map(k => an(kn(k)))) + '. ' : ''}${grown.join(' ')}` };
  buildTools();
  const b = opened.length && $('tools').querySelector(`[data-k="${opened[0]}"]`);
  if (b && b.scrollIntoView) b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

// ---- time ----
let botAt = 3;
function advance() {
  sim.tick();
  if (bot && sim.time >= botAt) { botAt = sim.time + 3; bot.step(); }
}
function events() {
  const quiet = sim.events.length > 150;   // a long run behind the page's back: no fireworks
  for (const e of sim.events.splice(0)) {
    if (e.type === 'tier') { stepOpened(e.tier); ping(523, 0.2, 0.06); ping(784, 0.3, 0.06); ping(1047, 0.4, 0.05); }
    if (e.type === 'offer') { showOffer(); ping(660, 0.2, 0.06); ping(990, 0.3, 0.05); }
    if (e.type === 'pick') { showOffer(); buildTools(); ping(520, 0.15, 0.06); ping(780, 0.25, 0.06); }
    if (quiet) continue;
    if (e.type === 'house') { fx.push({ k: 'ring', x: e.x + 0.5, y: e.y + 0.5, t: 0, life: 0.7 }); ping(700 + Math.random() * 200, 0.12, 0.04); }
    if (e.type === 'grow') { fx.push({ k: 'ring', x: e.x + 0.5, y: e.y + 0.5, t: 0, life: 0.9 }); ping(880, 0.15, 0.05); ping(1320, 0.2, 0.04); }
    if (e.type === 'built') { fx.push({ k: 'ring', x: e.x + 0.5, y: e.y + 0.5, t: 0, life: 0.9 }); ping(587, 0.12, 0.05); ping(880, 0.18, 0.04); }
    if (e.type === 'done') { fx.push({ k: 'ring', x: e.x + 0.5, y: e.y + 0.5, t: 0, life: 1.6, r: 2, c: '#f0c64a' }); ping(784, 0.3, 0.06); ping(1175, 0.5, 0.05); }
    if (e.type === 'ship') { fx.push({ k: 'ring', x: e.x + 0.5, y: e.y + 0.5, t: 0, life: 1.2, r: 1.2 }); ping(196, 0.5, 0.05, 'triangle'); }
    if (e.type === 'buy') ping(1040, 0.04, 0.012);
    if (e.type === 'drop') { fx.push({ k: 'ring', x: e.x, y: e.y, t: 0, life: 0.5, c: e.g && col(e.g) }); ping(260, 0.08, 0.05, 'triangle'); }
  }
}

let lastT = T(), acc = 0, hudAt = 0;
function frame() {
  const now = T(), dt = Math.min(0.1, now - lastT); lastT = now;
  acc += dt * speed;
  let n = 0;
  while (acc >= DT && n++ < 40) { advance(); acc -= DT; }
  if (n >= 40) acc = 0;
  simClock += dt * Math.min(speed, 1.5);
  events();
  if (now > hudAt) { hudAt = now + 0.3; hud(); if (picked && tool === 'view') say(describe(picked)); }

  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.fillStyle = '#a8d27a'; cx.fillRect(0, 0, cw, ch);
  cx.translate(cw / 2, ch / 2); cx.scale(cam.s, cam.s); cx.translate(-cam.x, -cam.y);
  cx.imageSmoothingEnabled = true;
  cx.fillStyle = Look.ground('water').col; cx.fillRect(-60, H - 2, W + 120, 60);
  cx.drawImage(land, 0, 0, W, H);
  drawRoads();
  drawParked();
  for (const h of sim.houses) drawHouse(h);
  for (const p of sim.parts) drawPart(p, simClock);
  drawLinks(simClock);
  for (const v of sim.vehicles) if (v.kind === 'lorry') drawVehicle(v);
  for (const v of sim.vehicles) if (v.kind === 'car') drawVehicle(v);
  drawPins(now);
  drawFlows(simClock);
  drawFx(dt);
  drawGhost();
  requestAnimationFrame(frame);
}
buildTools(); say(); setSpeed(speed); hud();
requestAnimationFrame(frame);
Object.assign(window, { sim, bot, cam, toScreen, setTool, setSpeed, look });
</script>
